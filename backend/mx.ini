; This is a mxdev configuration file
; it can be used to override versions of packages already defined in the
; constraints files and to add new packages from VCS like git.
; to learn more about mxdev visit https://pypi.org/project/mxdev/

[settings]
main-package = -e .[test]
; example how to override a package version
version-overrides =
    pydantic-ai-slim>=2.1.0
    pydantic>=2.13.4
    typing-extensions>=4.15.0
    ; pydantic-ai 2.1.0 -> genai-prices -> httpx2 needs h11>=0.16; Plone's base
    ; constraints pin h11==0.14.0 (via the selenium/robot test stack). wsproto
    ; 1.2.0 already allows h11<1,>=0.9.0, so only the pin needs lifting.
    h11>=0.16.0
;     example.package==2.1.0a2

; example section to use packages from git
; [example.contenttype]
; url = https://github.com/collective/example.contenttype.git
; pushurl = git@github.com:collective/example.contenttype.git
; extras = test
; branch = master

; example section to use packages from file system
; url = example.contenttype2
; vcs = fs
; extras = test

; example section to use packages from git with a frontend and backend addon
; [example.contenttype3]
; url = https://github.com/collective/example.contenttype3.git
; pushurl = git@github.com:collective/example.contenttype3.git
; extras = test
; branch = master
; subdirectory = backend # this is the important bit here

; Develop collective.aisettings from the local checkout in sources/ instead
; of the released PyPI package, so local edits (backend + static resources)
; are picked up by this instance. `vcs = fs` uses the existing directory as-is
; (no git operations); `subdirectory = backend` points at the Python package.
; [collective.aisettings]
; url = collective.aisettings
; vcs = fs
; subdirectory = backend
; extras = test
